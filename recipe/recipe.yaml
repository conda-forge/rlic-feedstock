schema_version: 1

context:
  name: rlic
  version: "0.5.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/rlic-${{ version }}.tar.gz
  sha256: 8445147f3eeab6eeb30237946992fb8e644c03deb15210d5b59aa1342b81aa6e

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ true if is_abi3 }}

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - make
    - maturin
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - maturin >=1.10,<2.0
    - pip
  run:
    - python
    - numpy >=1.23.6

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - rlic
      pip_check: true
  - files:
      source:
        - tests
    requirements:
      run:
        - pip
        - pytest
        - runtime-introspect
        - if: is_abi3
          then: abi3audit
    script:
      - pytest -ra tests
      - if: unix and is_abi3
        then: abi3audit $SP_DIR/rlic/_core.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      - if: win and is_abi3
        then: abi3audit %SP_DIR%/rlic/_core.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  summary: A minimal Line Integral Convolution extension for NumPy, written in Rust
  license: MIT
  license_file:
    - LICENSE_rlic
    - LICENSE_vectorplot
    - THIRDPARTY.yml
  homepage: https://github.com/neutrinoceros/rlic

extra:
  recipe-maintainers:
    - neutrinoceros
